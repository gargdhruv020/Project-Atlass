services:
  mysql:
    image: mysql:8.0
    container_name: atlas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-258000}
      MYSQL_DATABASE: ${DB_NAME:-project_atlas}
    ports:
      # Map container port 3306 to host port 3307 by default to prevent conflict
      # with any existing host MySQL development database on port 3306
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      # Isolated persistent volume for Docker review environment
      - atlas-mysql-data:/var/lib/mysql
      # Initialization script executed ONLY on first startup of a fresh volume
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - atlas-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-258000}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: atlas-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-258000}
      - DB_READONLY_USER=${DB_READONLY_USER:-atlas_readonly}
      - DB_READONLY_PASSWORD=${DB_READONLY_PASSWORD:-AtlasReadOnly2026!}
      - DB_NAME=${DB_NAME:-project_atlas}
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_data
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-market_reports}
      - API_KEY=${API_KEY:-atlas-dev-key-2026}
      - SECRET_KEY=${SECRET_KEY:-atlas-insecure-secret-key-change-in-production}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-huggingface}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - AUTO_INGEST_ON_STARTUP=${AUTO_INGEST_ON_STARTUP:-true}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Persistent vector database volume
      - atlas-chroma-data:/app/chroma_data
      # Read-only sample documents
      - ./documents:/app/documents:ro
    networks:
      - atlas-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  php-portal:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    container_name: atlas-php-portal
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-258000}
      - DB_NAME=${DB_NAME:-project_atlas}
      - FASTAPI_BASE_URL=http://backend:8000
      - API_KEY=${API_KEY:-atlas-dev-key-2026}
    ports:
      - "${PHP_PORT:-8080}:80"
    networks:
      - atlas-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  atlas-net:
    name: atlas-net
    driver: bridge

volumes:
  atlas-mysql-data:
    name: atlas-mysql-data
  atlas-chroma-data:
    name: atlas-chroma-data
